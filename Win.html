<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e14">
<title>YOU WIN</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at top, #1b2b36 0%, #0a0e14 62%);
    color: #00e6b8;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    text-align: center; padding: 24px 16px;
  }
  h1 {
    font-size: clamp(2rem, 8vw, 4rem);
    letter-spacing: 4px;
    margin: 0 0 16px;
    text-shadow: 0 0 20px #00e6b8;
    animation: glow 1.5s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px #00e6b8; }
    to   { text-shadow: 0 0 30px #00e6b8, 0 0 60px #00e6b8; }
  }
  p {
    color: #9aabb7;
    max-width: 520px;
    line-height: 1.6;
    margin: 0 0 12px;
  }
  .signature {
    margin-top: 8px;
    font-size: .85rem;
    color: #5f7280;
    letter-spacing: 1px;
  }
  video {
    margin-top: 24px;
    border-radius: 12px;
    max-width: 100%;
    width: 560px;
    box-shadow: 0 0 40px #00e6b855;
    background: #000;
  }
  #closing {
    display: none;
    margin-top: 20px;
    color: #00e6b8;
    font-weight: 700;
    animation: fadeIn 1.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 480px) {
    video { width: 100%; }
  }
</style>
</head>
<body>

<h1>SELAMAT!</h1>
<p>Kamu berhasil menyelesaikan seluruh teka-teki.<br>
Tapi hadiahnya... yah, begitulah. 😏</p>

<video id="hadiah" autoplay muted playsinline controls preload="auto">
  <source src="rickroll.mp4" type="video/mp4">
  Browser kamu nggak support video.
</video>

<p id="closing">Makasih udah main. Sampai jumpa di teka-teki berikutnya. 🔥</p>

<p class="signature">— Fun / F3c / modex —</p>

<script>
const v = document.getElementById('hadiah');
const closing = document.getElementById('closing');

// Coba autoplay dengan suara
v.muted = false;
const playPromise = v.play();

if (playPromise !== undefined) {
  playPromise.catch(() => {
    // Diblokir browser → mute dulu biar tetap jalan
    v.muted = true;
    v.play().catch(() => {});
  });
}

// Klik di mana saja = unmute + play
document.body.addEventListener('click', () => {
  v.muted = false;
  v.play().catch(() => {});
}, { once: true });

// Munculin pesan penutup setelah video selesai
v.addEventListener('ended', () => {
  closing.style.display = 'block';
});
</script>

</body>
</html>
